# London Right Now: given a place in London, a free time window and what the
# person is in the mood for, return the single best venue that is open for
# the whole window, plus up to four backups that each offer a different angle.
#
# The app keeps nothing between calls and is never told who is asking, so it
# has no memory of the person: everything it knows comes from these inputs and
# the live data sources it calls.

manifest_version: 1

persistence: none

app_author_name: "London_gems"

app:
  id: hack.app_b0e7
  name: London Right Now
  version: 0.2.0
  # Never use the word "by" here: the badge is parsed from
  # "[via <name> <version> by <author name>]".
  summary: >-
    Finds the best London cafe, museum, gallery, bookshop or restaurant open
    near you for the time you have free. It matches what you are in the mood
    for (a cuisine, a feel such as quiet or laptop-friendly, a budget), and
    whether you want to explore somewhere new or go back to one of your
    regular places: exploring favours independent places over chains and
    minds a longer walk less, while regulars puts the places you name first.
    When it does not know what you like, or you name a day without a time, it
    asks before it picks. For advice that fits your habits it relies on what
    Pippa knows about you: Pippa passes in your usual places, the kinds of
    place you like and whether you tend to explore, so the more you tell
    Pippa, the more personal the picks become. The app itself keeps nothing
    between questions. It keeps the walk short, never sends you somewhere
    that shuts before you are done, and weighs how busy each place is likely
    to be at the time you get there, where that data is available. Alongside
    its pick it offers alternatives that are closer, quieter, cheaper, better
    rated or open later. It sends the place you name to OpenStreetMap,
    postcodes.io and Open-Meteo, and the venues it considers to Google Places
    and BestTime when those are set up.

agent_types:
  - personal

outcomes:
  - id: venue.pick
    summary: >-
      Pick the best London cafe, museum, gallery, bookshop or restaurant that
      is open near a place for the whole of a free time window
    example_phrases:
      - what's open near me for the next hour
      - where can i get a good coffee near
      - which museum is still open near
      - somewhere open for lunch near
      - bookshop open near
      - gallery open late near
      - where to go with an hour free in london
      - quiet cafe with wifi near
      - somewhere not too busy near
      - somewhere new to explore near
    inputs:
      - name: location
        type: string
        required: false
        description: >-
          Where in London the person is or will be, exactly as they wrote it:
          an area ("Shoreditch"), a station ("King's Cross"), a postcode
          ("EC1V 9NR") or coordinates as "lat,lng". If the message does not
          say where, return an empty string rather than guessing, even if it
          says "near me".
      - name: category
        type: string
        required: false
        description: >-
          The kind of place, as exactly one of: cafe, museum, gallery,
          bookshop, restaurant. Coffee or tea means cafe; lunch, dinner or a
          named cuisine means restaurant; art means gallery. Use what they
          said in this message or earlier in this conversation. Return "any"
          only if they said they do not mind or want anything. If they never
          said what kind of place, return an empty string rather than guessing.
      - name: cuisine
        type: string
        required: false
        description: >-
          A food or drink the person named, such as "pasta", "Japanese" or
          "flat white". Return an empty string if they named none.
      - name: vibe
        type: array
        item_type: string
        required: false
        description: >-
          Short words for the kind of place they want, such as "quiet",
          "laptop-friendly", "outdoor seating", "vegan" or "wheelchair
          accessible". Leave this out if they asked for nothing like that.
      - name: mood
        type: string
        required: false
        description: >-
          Whether they want somewhere new or somewhere they know, from this
          message or earlier in this conversation, as exactly one of:
          "explore" (somewhere new or different), "familiar" (one of their
          usual or favourite places), "either" (they said they do not mind).
          Return an empty string if they have not said.
      - name: regulars
        type: array
        item_type: string
        required: false
        description: >-
          Names of places the person has said they go to often or like, in
          this conversation or that you already know they like. Leave this
          out if you know of none; never make names up.
      - name: day
        type: string
        required: false
        description: >-
          The day they named for their free time, such as "Sunday" or
          "Saturday", ONLY when they gave no clock time for it ("Sunday for
          an hour"). Return an empty string if they gave a time (put it in
          start instead) or named no day.
      - name: start
        type: datetime
        required: false
        description: >-
          When the free time starts, with a UTC offset, in London time, only
          if they gave a clock time ("at 2pm", "Sunday at 11"). Leave this
          out entirely if they mean now or named a day with no time; never
          guess a time.
      - name: end
        type: datetime
        required: false
        description: >-
          When the free time ends, with a UTC offset, if they gave an end
          time ("until 4pm"). Leave this out if they did not.
      - name: duration_min
        type: integer
        required: false
        description: >-
          How many minutes they have, if they said ("an hour" is 60). Leave
          this out entirely if they did not say how long; never guess.
      - name: budget
        type: integer
        required: false
        description: >-
          Their budget from 1 (cheap) to 4 (expensive), only if they mentioned
          price ("cheap" is 1, "not too pricey" is 2, "splash out" is 4).
          Leave this out entirely if they did not mention price.
      - name: exclude_venues
        type: array
        item_type: string
        required: false
        description: >-
          Names or ids of places the person has just turned down in this
          conversation ("not that one", "somewhere other than Prufrock").
          Leave this out if they turned none down.
    output:
      - name: status
        type: string
        description: "ok, needs_input (see needs) or no_results"
      - name: needs
        type: array
        item_type: string
        description: >-
          What is still needed before the app can answer: any of location,
          start_time, activity, mood, regulars
      - name: questions
        type: array
        item_type: string
        description: When status is needs_input, one question for each entry in needs, to ask in one go
      - name: preferences
        type: array
        item_type: string
        description: >-
          The preferences the person stated that this answer used, one short
          fact each ("kind of place: museum", "mood: explore", "regular
          places: Prufrock"), worth keeping for next time
      - name: assumptions
        type: array
        item_type: string
        description: What the app assumed or could not get, one short fact each
      - name: sources
        type: array
        item_type: string
        description: The data sources this answer came from
      - name: pick_venue_id
        type: string
        required: false
      - name: pick_name
        type: string
        required: false
      - name: pick_category
        type: string
        required: false
      - name: pick_address
        type: string
        required: false
      - name: pick_lat
        type: number
        required: false
      - name: pick_lng
        type: number
        required: false
      - name: pick_maps_url
        type: string
        required: false
      - name: pick_travel_mode
        type: string
        required: false
        description: How the travel time was worked out ("walk")
      - name: pick_travel_min
        type: integer
        required: false
      - name: pick_open_until
        type: string
        required: false
        description: Closing time as HH:MM London time, "HH:MM next day", or "open 24 hours"
      - name: pick_time_available_min
        type: integer
        required: false
        description: Minutes there between arriving and the end of the free time
      - name: pick_busyness
        type: string
        required: false
        description: "quiet, moderate, busy or unknown. Unknown means no data, never a guess"
      - name: pick_busyness_source
        type: string
        required: false
        description: "live, forecast or none"
      - name: pick_busier_after
        type: string
        required: false
        description: The hour (HH:MM) from which the forecast says it gets busier
      - name: pick_rating
        type: number
        required: false
      - name: pick_review_count
        type: integer
        required: false
      - name: pick_price_level
        type: integer
        required: false
        description: 0 (free) to 4 (very expensive)
      - name: pick_reasons
        type: array
        item_type: string
        required: false
        description: Short factual phrases saying why this place was picked
      - name: pick_tip
        type: string
        required: false
        description: A description from the data source; absent when the source has none
      - name: pick_score
        type: number
        required: false
        description: The pick's score from 0 to 1
      - name: backups
        type: array
        item_type: string
        description: >-
          Up to four alternatives, each "angle: name (category), N min walk,
          open until HH:MM, busyness X[, rating R], id ID". The angle is one of
          closer, quieter, cheaper, higher_rated, open_later, next_best

# Both keys are optional: without them the app uses OpenStreetMap for venues
# and reports busyness as "unknown". Set them in Pippa under Apps > Created by
# me > London Right Now > Keys, never in any file here.
app_secrets:
  - name: GOOGLE_PLACES_API_KEY
    description: "Google Places API (New) key, for venue ratings, prices and opening hours"
    required: false
  - name: BESTTIME_API_KEY
    description: "BestTime.app private key, for live and forecast busyness of the venues considered"
    required: false
